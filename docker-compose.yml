version: '3.8'

services:
  # ==========================================
  # 1. INFRAESTRUCTURA (Brokers y Bases de Datos)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - voting_network

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    networks:
      - voting_network

  kafka-init:
    image: confluentinc/cp-kafka:7.4.4
    container_name: kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic eligible_voters --partitions 1 --replication-factor 1 --config cleanup.policy=compact
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic raw_votes --partitions 1 --replication-factor 1 --config cleanup.policy=compact
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic security_alerts --partitions 1 --replication-factor 1
      "
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - voting_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Panel web de RabbitMQ
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - voting_network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: voting_audit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d voting_audit"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - db_internal

  # ==========================================
  # 2. MICROSERVICIOS (Código Java Spring Boot)
  # ==========================================
  voter-registration:
    build:
      context: ./voter_registration_service
    container_name: voter_registration_service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - voting_network

  voting-api:
    build:
      context: ./voting_api
    container_name: voting_api
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PRELOAD_TEST_VOTERS=false
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    networks:
      - voting_network

  vote-processor:
    build:
      context: ./vote_processor
    container_name: vote_processor
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    networks:
      - voting_network

  regional-rollup:
    build:
      context: ./regional_rollup_service
    container_name: regional_rollup_service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
    networks:
      - voting_network

  bot-detector:
    build:
      context: ./bot_detector_service
    container_name: bot_detector_service
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DB_HOST=postgres
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - voting_network
      - db_internal

  analytics-archiver:
    build:
      context: ./analytics_archiver
    container_name: analytics_archiver
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DB_HOST=postgres
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - voting_network
      - db_internal

  global-dashboard:
    build:
      context: ./global_dashboard_worker
    container_name: global_dashboard_worker
    environment:
      - RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES=true
      - SPRING_AMQP_DESERIALIZATION_TRUST_ALL=true
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - voting_network

  regional-dashboard:
    build:
      context: ./regional_dashboard_worker
    container_name: regional_dashboard_worker
    environment:
      - RABBITMQ_HOST=rabbitmq
      - SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES=true
      - SPRING_AMQP_DESERIALIZATION_TRUST_ALL=true
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - voting_network

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - voting-api
      - global-dashboard
      - regional-dashboard
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - voting_network

networks:
  voting_network:
    driver: bridge
  db_internal:
    driver: bridge
    internal: true
