<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Regional de Votación</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #e2e8f0; }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; }
        h1 { margin: 0; font-size: 1.5rem; color: #a78bfa; }
        nav a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; margin-left: 1rem; }
        nav a:hover { color: #a78bfa; }
        .status { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; padding: 0.3rem 0.75rem; border-radius: 999px; background: #1e293b; border: 1px solid #334155; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
        .dot.connected { background: #10b981; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.25rem; }
        .card h3 { margin: 0 0 1rem 0; color: #c4b5fd; font-size: 1.1rem; }
        .candidate { margin-bottom: 0.85rem; }
        .candidate-header { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 0.3rem; }
        .bar-bg { height: 10px; background: #0f172a; border-radius: 999px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #a78bfa); border-radius: 999px; transition: width 0.35s ease; }
        .empty { color: #64748b; font-style: italic; }
    </style>
</head>
<body>
    <header>
        <h1>Resultados Regionales en Vivo</h1>
        <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
            <span class="status"><span id="dot" class="dot"></span><span id="ws-status">Conectando...</span></span>
            <nav>
                <a href="http://localhost:8080/" target="_blank">Votar</a>
                <a href="http://localhost:8081/dashboard.html" target="_blank">Global</a>
            </nav>
        </div>
    </header>

    <div id="regions" class="grid"><p class="empty">Esperando resultados regionales...</p></div>

    <script>
        const regionsState = {};
        function render() {
            const container = document.getElementById('regions');
            const regions = Object.entries(regionsState);
            if (regions.length === 0) return;
            container.innerHTML = '';
            regions.sort((a, b) => a[0].localeCompare(b[0])).forEach(([region, candidates]) => {
                const entries = Object.entries(candidates).sort((a, b) => b[1] - a[1]);
                const total = entries.reduce((acc, [, s]) => acc + s, 0);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>Región: ${region.toUpperCase()}</h3>`;
                entries.forEach(([cand, score]) => {
                    const pct = total > 0 ? Math.round((score / total) * 100) : 0;
                    const item = document.createElement('div');
                    item.className = 'candidate';
                    item.innerHTML = `
                        <div class="candidate-header">
                            <span><strong>${cand}</strong></span>
                            <span>${score} pts (${pct}%)</span>
                        </div>
                        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
                    `;
                    card.appendChild(item);
                });
                container.appendChild(card);
            });
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const ws = new WebSocket(`${proto}//${location.host}/ws-regional`);
            const dot = document.getElementById('dot');
            const status = document.getElementById('ws-status');

            ws.onopen = () => {
                dot.classList.add('connected');
                status.textContent = 'En vivo';
            };
            ws.onclose = () => {
                dot.classList.remove('connected');
                status.textContent = 'Reconectando...';
                setTimeout(connect, 2000);
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (!data.region) return;
                regionsState[data.region] = data.candidates || {};
                render();
            };
        }
        connect();
    </script>
</body>
</html>
